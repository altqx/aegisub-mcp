[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisub-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Aegisub / ASS subtitles: line access, styles, tags, typesetting, drawing, clipping, karaoke, timing, Lua automations, QC and libass-rendered verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "altqx" }]
keywords = ["aegisub", "ass", "subtitles", "mcp", "karaoke", "typesetting", "libass"]
dependencies = [
    # 2.x is the first line that ships mcp.server.mcpserver.MCPServer, which
    # server.py imports; 1.x only has FastMCP/Server and fails with ImportError.
    "mcp>=2.2",
    "lupa>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]
metrics = ["fonttools>=4.50", "uharfbuzz>=0.39"]

[project.scripts]
aegisub-mcp = "aegisub_mcp.server:main"
# Streamable HTTP, the only transport that can serve protocol 2026-07-28 (the
# stateless per-request envelope); see src/aegisub_mcp/http_server.py.
aegisub-mcp-http = "aegisub_mcp.http_server:main"
# File bridge to a running Aegisub (status/publish/watch/install); see
# src/aegisub_mcp/bridge.py and src/aegisub_mcp/assets/krapau-bridge.lua.in.
aegisub-mcp-bridge = "aegisub_mcp.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisub_mcp"]
# The Aegisub-side Lua template is data, not Python; make sure it ships.
artifacts = ["src/aegisub_mcp/assets/*.lua.in", "src/aegisub_mcp/lua/*.lua", "src/aegisub_mcp/lua/include/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
